"""Tests for the Recorder orchestrator.

We do not start pynput listeners here — the recorder exposes ``feed_*``
methods that the listeners forward into. Tests inject events directly and
override the screenshot backend so no display is needed.
"""

from __future__ import annotations

import json
import time
from pathlib import Path
from typing import Iterator

import pytest

from dare.recorder.recorder import Recorder, RecorderConfig
from dare.recorder.screenshot import ScreenshotManager


class _FakeShots(ScreenshotManager):
    """Override the OS-level grab so tests don't need a display."""

    def __init__(self, screenshots_dir: Path):
        super().__init__(screenshots_dir, monitor_index=0)

    def _grab_raw(self):  # type: ignore[override]
        # 4×4 black RGB frame
        return bytes(4 * 4 * 3), 4, 4


@pytest.fixture
def run_dir(tmp_path: Path) -> Iterator[Path]:
    d = tmp_path / "run"
    (d / "raw").mkdir(parents=True)
    (d / "assets" / "screenshots").mkdir(parents=True)
    (d / "logs").mkdir(parents=True)
    yield d


def _make_recorder(run_dir: Path, **overrides) -> Recorder:
    cfg = RecorderConfig(
        inactivity_seconds=overrides.pop("idle", 30.0),
        keyboard_flush_idle=overrides.pop("flush", 1.5),
        double_esc_window=overrides.pop("desc", 0.5),
        capture_mouse_move=overrides.pop("moves", False),
    )
    rec = Recorder(
        run_dir=run_dir,
        config=cfg,
        cursor_provider=lambda: (50, 60),
        active_window_provider=lambda: "test_window",
    )
    # Swap in the fake screenshot backend
    rec.shots = _FakeShots(run_dir / "assets" / "screenshots")
    return rec


def _read_events(run_dir: Path) -> list[dict]:
    p = run_dir / "raw" / "raw_events.jsonl"
    if not p.is_file():
        return []
    return [json.loads(line) for line in p.read_text(encoding="utf-8").splitlines() if line.strip()]


# ---------------------------------------------------------------------------


def test_mouse_click_writes_event_and_screenshot(run_dir: Path) -> None:
    rec = _make_recorder(run_dir)
    rec.start()
    try:
        ev = rec.feed_mouse_click(100, 200, "Button.left", timestamp=1.0)
        assert ev["type"] == "mouse_click"
        assert ev["x"] == 100 and ev["y"] == 200
        assert ev["screenshot"].startswith("s_")
        # Screenshot file actually exists
        assert (run_dir / "assets" / "screenshots" / ev["screenshot"]).is_file()
    finally:
        rec.close()
    events = _read_events(run_dir)
    types = [e["type"] for e in events]
    assert "screenshot" in types
    assert "mouse_click" in types


def test_keyboard_burst_flushes_into_one_event(run_dir: Path) -> None:
    rec = _make_recorder(run_dir, flush=0.5)
    rec.start()
    try:
        t0 = time.time()
        rec.feed_keyboard("0", "0", timestamp=t0)
        rec.feed_keyboard(".", ".", timestamp=t0 + 0.1)
        rec.feed_keyboard("2", "2", timestamp=t0 + 0.2)
        rec.feed_keyboard("5", "5", timestamp=t0 + 0.3)
        # Sleep just a hair longer than the quiescence window so the flusher
        # thread fires on its own.
        time.sleep(1.0)
    finally:
        rec.close()
    events = _read_events(run_dir)
    kbd = [e for e in events if e["type"] == "keyboard_input"]
    assert len(kbd) == 1, f"expected exactly one flushed kbd event, got {len(kbd)}"
    assert kbd[0]["text"] == "0.25"
    # Both before and after screenshots are recorded
    assert kbd[0]["before_screenshot"] is not None
    assert kbd[0]["after_screenshot"] is not None


def test_click_during_typing_flushes_burst(run_dir: Path) -> None:
    """A click that lands during a typing burst must close the burst as
    its 'after' screenshot."""
    rec = _make_recorder(run_dir, flush=10.0)  # huge flush window
    rec.start()
    try:
        rec.feed_keyboard("a", "a", timestamp=1.0)
        rec.feed_keyboard("b", "b", timestamp=1.1)
        rec.feed_mouse_click(10, 20, "Button.left", timestamp=1.5)
    finally:
        rec.close()
    events = _read_events(run_dir)
    kbd = [e for e in events if e["type"] == "keyboard_input"]
    assert len(kbd) == 1
    assert kbd[0]["text"] == "ab"
    # The click forces the kbd flush, so the kbd event must have an after_screenshot.
    assert kbd[0]["after_screenshot"] is not None


def test_double_esc_triggers_stop(run_dir: Path) -> None:
    rec = _make_recorder(run_dir, desc=0.5, idle=999.0)
    rec.start()
    try:
        rec.feed_keyboard("Key.esc", None, timestamp=time.time())
        rec.feed_keyboard("Key.esc", None, timestamp=time.time() + 0.1)
        # The recorder's stopped_event should fire
        assert rec.wait_until_stopped(timeout=1.0)
        assert rec.stats["stop_reason"] == "double_esc"
    finally:
        rec.close()


def test_idle_timeout_triggers_stop(run_dir: Path) -> None:
    """Use a very short idle timeout (0.2s) to exercise the watcher
    thread end-to-end without slowing the suite."""
    rec = _make_recorder(run_dir, idle=0.2)
    rec.start()
    try:
        # Inject one click, then sit idle.
        rec.feed_mouse_click(0, 0, "Button.left")
        assert rec.wait_until_stopped(timeout=2.0)
        assert rec.stats["stop_reason"] == "idle_timeout"
    finally:
        rec.close()


def test_close_persists_stats(run_dir: Path) -> None:
    rec = _make_recorder(run_dir)
    rec.start()
    rec.feed_mouse_click(1, 1, "Button.left")
    rec.feed_mouse_click(2, 2, "Button.left")
    rec.feed_keyboard("a", "a")
    rec.close()
    stats_path = run_dir / "raw" / "stats.json"
    assert stats_path.is_file()
    stats = json.loads(stats_path.read_text(encoding="utf-8"))
    assert stats["mouse_clicks"] == 2
    assert stats["keystrokes"] >= 1


def test_close_drains_in_flight_keyboard_burst(run_dir: Path) -> None:
    rec = _make_recorder(run_dir, flush=10.0)
    rec.start()
    rec.feed_keyboard("h", "h")
    rec.feed_keyboard("i", "i")
    # Close happens before the flusher would have triggered
    rec.close()
    events = _read_events(run_dir)
    kbd = [e for e in events if e["type"] == "keyboard_input"]
    assert len(kbd) == 1
    assert kbd[0]["text"] == "hi"


def test_starting_twice_raises(run_dir: Path) -> None:
    rec = _make_recorder(run_dir)
    rec.start()
    try:
        with pytest.raises(RuntimeError):
            rec.start()
    finally:
        rec.close()


def test_close_is_idempotent(run_dir: Path) -> None:
    rec = _make_recorder(run_dir)
    rec.start()
    rec.close()
    rec.close()  # must not raise


def test_jsonl_is_one_line_per_event(run_dir: Path) -> None:
    rec = _make_recorder(run_dir)
    rec.start()
    try:
        rec.feed_mouse_click(1, 2, "Button.left")
        rec.feed_mouse_click(3, 4, "Button.right")
    finally:
        rec.close()
    raw = (run_dir / "raw" / "raw_events.jsonl").read_text(encoding="utf-8")
    # Every non-empty line must parse independently
    lines = [l for l in raw.splitlines() if l.strip()]
    for line in lines:
        json.loads(line)
    # Both clicks should be present
    types = [json.loads(l).get("type") for l in lines]
    assert types.count("mouse_click") == 2


def test_capture_moves_disabled_by_default(run_dir: Path) -> None:
    rec = _make_recorder(run_dir, moves=False)
    rec.start()
    try:
        result = rec.feed_mouse_move(10, 20)
        assert result is None
    finally:
        rec.close()
    events = _read_events(run_dir)
    assert not any(e["type"] == "mouse_move" for e in events)


def test_capture_moves_enabled_records_them(run_dir: Path) -> None:
    rec = _make_recorder(run_dir, moves=True)
    rec.start()
    try:
        rec.feed_mouse_move(10, 20)
        rec.feed_mouse_move(11, 21)
    finally:
        rec.close()
    events = _read_events(run_dir)
    moves = [e for e in events if e["type"] == "mouse_move"]
    assert len(moves) == 2


def test_preflight_returns_list() -> None:
    # We can't easily spoof Wayland in CI, just check the contract.
    rec = Recorder(
        run_dir=Path("/tmp/dare_preflight_unused"),
        cursor_provider=lambda: (0, 0),
        active_window_provider=lambda: "x",
    )
    problems = rec.preflight()
    assert isinstance(problems, list)
    for p in problems:
        assert isinstance(p, str) and p
