[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dare-desktop-action-recording-execution"
version = "0.1.0"
description = "D.A.R.E. Desktop Action Recording and Execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10",
  "pynput>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["fastmcp>=2"]

[project.scripts]
dare = "dare.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dare*"]
